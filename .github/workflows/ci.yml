name: gates
# Roadmap M0: the gates are commands, so CI runs the commands. A green badge that
# checks nothing is worse than no badge, because it launders a missing check into
# a passed one.
#
# GitHub-hosted windows-latest for now. It is x86-64, so T1 (which executes real
# instructions against real EFLAGS) is a valid oracle here; a self-hosted runner
# stays in the plan for `flags --full` volume and for pinning the clang version.
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * *" # nightly: the full T1 sweep

jobs:
  gates:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: toolchain
        run: |
          rustc -V
          cargo -V
          clang --version

      - name: fmt
        run: cargo fmt --check

      - name: clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: "ratchet (no NEW panic site in a library crate's non-test code; .gate/unwrap-baseline)"
        run: bash scripts/unwrap_ratchet.sh

      - name: "corpus (C + C++ objects: generated, and tests read them)"
        # Generated, not committed (`*.obj` is gitignored) - so it has to exist
        # BEFORE the test step: the demangle integration tests read
        # corpus/cpp/obj/*.obj, and CI failed with "The system cannot find the path
        # specified" when the generation step sat after them (run 41415743892).
        # The C corpus has the same property, and the same trap: the relocation tests
        # (crates/arch-x86/tests/relocs.rs, rip_sites.rs) assert the loader's parsed
        # relocation set against `llvm-objdump -r` on real corpus objects, so `corpus`
        # must run here too - it used to live only in the later determinism step, and
        # CI went red the same way (run 42148930772). Any test that reads a corpus
        # object needs generation on its left in this file.
        # The C++ gate itself, and the two-build manifest checks, stay in the later
        # "corpus" and "cpp corpus + demangle" steps.
        shell: powershell
        run: |
          cargo run -q -p rdec-cli -- corpus
          cargo run -q -p rdec-cli -- corpus --cpp

      - name: "types (M6: recovered signatures vs corpus/truth.tsv, baseline-ratcheted)"
        # Sits on the RIGHT of the corpus step above, in the SAME job: this gate reads
        # corpus/manifest.tsv, the .obj files it names, and corpus/truth.tsv, and the
        # objects are generated, not committed. Twice a corpus-reading step whose
        # generation lived in another job/stage shipped red CI (runs 41415743892,
        # 42148930772), so the ordering is pinned by a test:
        # crates/cli/tests/types_ci_wiring.rs.
        # The raw gate is RED by design (exit 1) while the named carry_chain
        # void-return lies stand, so its code is ASSERTED, not dropped; the battery
        # must be green; the step's verdict is the `.gate/types-baseline` ratchet,
        # which is red on a rise, on a fall, and on any family with no row.
        shell: powershell
        run: |
          cargo run -q -p rdec-cli -- types --corpus
          Write-Host "types --corpus raw verdict exit $LASTEXITCODE (1 = the named lies in .gate/types-baseline are still standing)"
          if ($LASTEXITCODE -ne 1) { throw "types --corpus raw verdict changed: expected 1 while the 4 named lies stand, got $LASTEXITCODE (update .gate/types-baseline and the ROADMAP ledger in the same commit)" }
          cargo run -q -p rdec-cli -- types --selftest
          if ($LASTEXITCODE -ne 0) { throw "types --selftest failed" }
          cargo run -q -p rdec-cli -- types --corpus --baseline .gate/types-baseline
          if ($LASTEXITCODE -ne 0) { throw "types baseline ratchet failed (rise, fall, or an unnamed lie family)" }

      - name: test (B1-B7 fixtures, TV, T1 grid, sabotage)
        run: cargo test --no-fail-fast

      - name: selftest (the verifier must be able to fail)
        run: cargo run -q -p rdec-cli -- selftest

      - name: flags (T1 grid against real EFLAGS)
        run: cargo run -q -p rdec-cli -- flags

      - name: corpus (two builds, same toolchain, byte-identical manifest)
        # The determinism claim worth testing: the same compiler, twice, must
        # produce the same corpus. The old step ran `git diff --exit-code`, which
        # asserted byte-identical codegen against the committed manifest -- that
        # compares clang versions (the runner has 20.1.8, the manifest was built
        # with 22.1.8), not RDec. The manifest now records its compiler, and
        # `status` re-parses every object's Machine field.
        # Explicit: this step uses PowerShell cmdlets and fc.exe. The default
        # shell on windows-latest happens to be pwsh, and "happens to be" is
        # exactly what a workflow should not depend on.
        shell: powershell
        run: |
          cargo run -q -p rdec-cli -- corpus
          cargo run -q -p rdec-cli -- corpus --out corpus-a
          Copy-Item corpus-a/manifest.tsv m1.tsv
          cargo run -q -p rdec-cli -- corpus --out corpus-a
          Copy-Item corpus-a/manifest.tsv m2.tsv
          fc.exe /b m1.tsv m2.tsv

      - name: "objdump-check (M1 instruction boundaries vs llvm-objdump, whole corpus)"
        shell: powershell
        run: cargo run -q -p rdec-cli -- objdump-check --corpus

      - name: "cpp corpus + demangle (M8: MSVC C++ names vs llvm-nm)"
        # corpus/cpp/obj/*.obj are GENERATED, not committed (`*.obj` is gitignored),
        # exactly like the C corpus: what is committed is the sources and the
        # manifest. CI therefore has to build the C++ corpus before the demangle
        # tests and gate run - without this step CI failed with "corpus/cpp/obj: The
        # system cannot find the path specified" (run 41415743892).
        # The manifest check is the SAME-TOOLCHAIN two-build comparison used for the C
        # corpus, NOT `git diff` against the committed manifest: the committed one was
        # written by clang 22.1.8 and the runner has 20.1.8, so a diff compares
        # compilers, not RDec.
        shell: powershell
        run: |
          cargo run -q -p rdec-cli -- corpus --cpp
          cargo run -q -p rdec-cli -- corpus --cpp --out cpp-a
          Copy-Item cpp-a/manifest.tsv c1.tsv
          cargo run -q -p rdec-cli -- corpus --cpp --out cpp-a
          Copy-Item cpp-a/manifest.tsv c2.tsv
          fc.exe /b c1.tsv c2.tsv
          cargo run -q -p rdec-cli -- demangle --cpp

      - name: "cpp (M8 step 1: the C++ corpus through the C pipeline)"
        # The first real C++ measurement: the existing lift -> passes -> emit-C
        # pipeline over corpus/cpp, functions named from their DEMANGLED text,
        # the whole generated TU compiled with clang -Werror, and every gap in a
        # named refusal class. The corpus/cpp objects are generated by the step
        # above, so this step needs no clang++ of its own.
        shell: powershell
        run: cargo run -q -p rdec-cli -- cpp --corpus

      - name: "t2 (differential: decompiled C value-verified against the machine)"
        # The strongest gate in the repo was not in CI: it links the corpus objects,
        # calls the machine code and the generated C on the same vectors, and compares
        # the full 64-bit RAX. Red here means a miscompile, not a style problem.
        shell: powershell
        run: cargo run -q -p rdec-cli -- t2 --corpus

      - name: "t2 --cpp (M8 step 3: decompiled C++ value-verified against the machine)"
        shell: powershell
        run: cargo run -q -p rdec-cli -- t2 --cpp

      - name: status (prints section 9's table from the commands above)
        run: cargo run -q -p rdec-cli -- status

  msvc:
    # Roadmap section 3 promises the corpus matrix `{clang, gcc, MSVC}`; until this
    # job the corpus path was clang-only. Same corpus/src/*.c, compiled by cl, gated
    # by the SAME commands through `--corpus-dir corpus/msvc` - one code path per
    # gate, a different denominator, not a second and weaker copy of each gate.
    #
    # Two facts make this its own job:
    #   * `cl` is NOT on PATH on windows-latest. `scripts/msvc-env.ps1` locates the
    #     toolset with vswhere and writes a vcvars64 wrapper batch, because `call
    #     vcvars64.bat` is a cmd builtin that a Rust child process cannot call. The
    #     step prints the cl banner: a leg built with an unrecorded compiler is a
    #     leg nobody can reproduce.
    #   * The gate is SAME-toolchain determinism - cl twice into ONE directory,
    #     identical manifest - never cross-compiler byte equality. The runner's
    #     clang 20.1.8 vs a local 22.1.8 already moved a gate from 1364 to 1412
    #     comparisons; cl-vs-clang object bytes would measure the vendors, not rdec.
    #
    # The objects are generated and gitignored (`*.obj`) exactly like the clang
    # corpus, so generation is on the LEFT of every step that reads them - the
    # "system cannot find the path specified" red of runs 41415743892 / 42148930772.
    #
    # The fast form runs here (objdump-check capped at 40 symbols = 40 objdump
    # spawns); `--full` is nightly. The clang job's ~21 minutes is unchanged: this
    # is a parallel job, not a step in that one.
    needs: gates
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: D:\rdec-msvc-target
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: "build rdec-cli"
        run: cargo build -p rdec-cli

      - name: "MSVC corpus (cl, located by vswhere; twice into one dir, manifest must match)"
        shell: powershell
        run: .\scripts\msvc-corpus.ps1

      - name: "msvc_corpus suite (the corpus-reading tests, run WHERE their inputs exist)"
        # This suite is part of `cargo test`, which runs in the `gates` job - a job
        # with clang and no cl, so it can never generate corpus/msvc. Its five
        # real-corpus legs therefore SKIP LOUDLY there (each prints the command that
        # removes the skip) and PASS HERE, where the step above generated the
        # objects. Running them only in a job that cannot produce their inputs is a
        # green that proves nothing; failing them RED in the clang job is the
        # "system cannot find the path specified" red of runs 41415743892 /
        # 42148930772. This step is their honest home: 7 tests, real objects, real
        # gates, exit code = verdict.
        run: cargo test -p rdec-cli --test msvc_corpus

      - name: "msvc-gates (fast: objdump-check + discover + lift + refusal census by mnemonic)"
        # The census is MEASUREMENT and prints; what this step exits non-zero on is
        # an empty corpus, a non-AMD64 object, a broken objdump boundary, an
        # unreachable symbol-table function, IR a pass broke, a refusal counted
        # under no key, and emitted C that clang -Werror rejects.
        shell: powershell
        run: .\scripts\msvc-gates.ps1 -Limit 40

  release-parity:
    # Release mode is what a user runs, and `--release` compiles OUT every
    # `debug_assert!` - including the ones in the decoder that keep iced's
    # instruction claims honest. A gate that only ever runs in debug proves the
    # claims of a build nobody ships. Measured parity at c584a10: every floor is
    # identical to debug (discover 100.00% 5956/5956, gaps none; c 124 lifted /
    # 86 emitted / 38 refused / 0 invalid; t2 --corpus 1412/1412/mismatch 0 with the
    # same 4 faults; t2 --cpp 856/856/0; objdump-check OK; demangle 68/68; `status`
    # exit 0 with zero FAIL rows) and the whole suite passes with the asserts gone:
    # 180 passed, 0 failed.
    #
    # The binary is target/release/rdec.exe - the PACKAGE is rdec-cli, the BINARY is
    # rdec. A script that names `rdec-cli.exe` reports "no binary" and looks exactly
    # like a build failure (measured: it cost two runs of this measurement).
    needs: gates
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: "build (release mode; every debug_assert is compiled out)"
        run: cargo build --release -p rdec-cli

      - name: "corpus (generated, gitignored; the gates read these objects)"
        run: |
          cargo run --release -q -p rdec-cli -- corpus
          cargo run --release -q -p rdec-cli -- corpus --cpp

      - name: "gates under release (the same commands, the same floors)"
        run: |
          cargo run --release -q -p rdec-cli -- discover --corpus
          cargo run --release -q -p rdec-cli -- c --corpus
          cargo run --release -q -p rdec-cli -- cpp --corpus
          cargo run --release -q -p rdec-cli -- lift --corpus
          cargo run --release -q -p rdec-cli -- objdump-check --corpus
          cargo run --release -q -p rdec-cli -- demangle --cpp
          cargo run --release -q -p rdec-cli -- t2 --corpus
          cargo run --release -q -p rdec-cli -- t2 --cpp
          cargo run --release -q -p rdec-cli -- status
          # The M6 census under release (asserts compiled out): the same baseline
          # ratchet, on the objects generated by the corpus step above.
          cargo run --release -q -p rdec-cli -- types --corpus --baseline .gate/types-baseline
          if ($LASTEXITCODE -ne 0) { throw "types baseline ratchet failed under release" }

      - name: "test --release (fixtures, TV, T1 grid, sabotage; asserts OFF)"
        run: cargo test --release --workspace --no-fail-fast

      - name: "ratchet (panic sites; the same gate, on the release tree)"
        run: bash scripts/unwrap_ratchet.sh

  t1-full:
    # 9.7e9 probes against hardware EFLAGS, ~6 min release build. Nightly/dispatch
    # only: the grid is the PR gate, the sweep is the regression net.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: gates
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: flags --full
        run: cargo run --release -q -p rdec-cli -- flags --full 20000
