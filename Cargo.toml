[workspace]
resolver = "3"
members = ["crates/core", "crates/arch-x86", "crates/verify", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
# iced-x86 = the pure-Rust x86/x86-64 decoder+encoder+formatter (MIT).
# NB: the crates.io name `iced` is the GUI toolkit, not this.
iced-x86 = { version = "1", default-features = false, features = ["std", "decoder", "encoder", "intel", "nasm"] }
goblin = "0.10"
rdec-core = { path = "crates/core" }
rdec-arch-x86 = { path = "crates/arch-x86" }
rdec-verify = { path = "crates/verify" }

[profile.release]
debug = 1
